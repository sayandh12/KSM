{% load static %}
<!-- {% block title %}Sign In - KSM Workshop{% endblock %} -->

{% block content %}
<style>
    body { background-color: #0a0f19 !important; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1rem;
        background: radial-gradient(circle at top right, rgba(52, 152, 219, 0.1), transparent),
                    radial-gradient(circle at bottom left, rgba(41, 128, 185, 0.1), transparent),
                    linear-gradient(rgba(10, 15, 25, 0.85), rgba(10, 15, 25, 0.75)), 
                    url("{% static 'images/auth-bg.png' %}") no-repeat center center fixed;
        background-size: cover;
    }
    .auth-card {
        width: 100%;
        max-width: 500px;
        background: rgba(13, 20, 32, 0.7);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 30px;
        padding: 3rem;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
    }
    .auth-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(52, 152, 219, 0.1) 180deg, transparent 360deg);
        animation: rotate 10s linear infinite;
        z-index: -1;
    }
    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .auth-header {
        margin-bottom: 4rem;
        text-align: center;
    }
    .auth-header h2 {
        color: #fff;
        font-weight: 900;
        letter-spacing: -2px;
        margin-bottom: 1rem;
        font-size: 2.5rem;
        background: linear-gradient(135deg, #fff 0%, #3498db 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
    }
    .auth-header p {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
    }
    .form-group {
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }
    .form-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.75rem;
        font-weight: 800;
        margin-bottom: 0;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        width: 30%;
        text-align: left;
        padding-left: 1.5rem;
    }
    .form-control {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 12px !important;
        color: #fff !important;
        padding: 0.8rem 1.2rem !important;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
        font-size: 0.95rem !important;
        text-align: left;
        width: 70%;
    }
    @media (max-width: 768px) {
        .form-group, .field-wrapper {
            flex-direction: column;
            align-items: flex-start;
            gap: 1rem;
        }
        .form-label {
            width: 100%;
            text-align: left;
        }
        .form-control {
            width: 100%;
        }
    }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.06) !important;
        border-color: rgba(52, 152, 219, 0.5) !important;
        box-shadow: 0 0 30px rgba(52, 152, 219, 0.2) !important;
        outline: none;
        transform: translateY(-2px);
    }
    .btn-login {
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 900;
        padding: 0.9rem;
        width: 100%;
        margin-top: 1rem;
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.85rem;
        cursor: pointer;
        box-shadow: 0 15px 30px rgba(52, 152, 219, 0.2);
    }
    .btn-login:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 30px 60px rgba(52, 152, 219, 0.4);
        background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
    }
    .auth-footer {
        text-align: center;
        margin-top: 3.5rem;
        color: rgba(255, 255, 255, 0.4);
        font-size: 1rem;
    }
    .auth-footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: 800;
        transition: all 0.3s ease;
        margin-left: 8px;
        position: relative;
    }
    .auth-footer a::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 1px;
        background: #3498db;
        transition: width 0.3s ease;
    }
    .auth-footer a:hover {
        color: #fff;
    }
    .auth-footer a:hover::after {
        width: 100%;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header text-center">
            <h2>Welcome Back</h2>
            <p>Access your premium dashboard</p>
        </div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control" placeholder="Enter your {{ field.label|lower }}" required id="{{ field.id_for_label }}">
                    {% if field.errors %}
                        <div class="text-danger mt-1" style="font-size: 0.8rem;">
                            {{ field.errors.0 }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account?<a href="{% url 'register' %}">Create Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
