<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KSM Workshop{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; overflow-x: hidden; }
        .navbar { 
            backdrop-filter: blur(20px);
            background-color: rgba(10, 15, 25, 0.9) !important;
            border-bottom: 2px solid rgba(52, 152, 219, 0.3); /* Premium accent border */
            padding: 1.2rem 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand img {
            height: 48px;
            width: auto;
            filter: drop-shadow(0 0 8px rgba(52, 152, 219, 0.4)); /* Subtle glow */
            transition: transform 0.3s ease;
        }
        .navbar-brand:hover img {
            transform: scale(1.08) rotate(-5deg);
        }
        .nav-link {
            font-size: 0.95rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.8) !important;
            margin: 0 15px;
            position: relative;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #3498db !important;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 50%;
            background-color: #3498db;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(-50%);
        }
        .nav-link:hover::after {
            width: 100%;
        }
        /* Dashboard Cards */
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }

        /* Animations */
        /* Smooth Premium Slide-Reveal Animation */
        .reveal-container {
            overflow: hidden;
            display: inline-block;
            vertical-align: bottom;
            height: 1.25em;
            position: relative;
        }

        .slide-in {
            animation: slide-in 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        .slide-out {
            animation: slide-out 0.8s cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        @keyframes slide-in {
            0% { transform: translateY(50%); opacity: 0; filter: blur(5px); }
            100% { transform: translateY(0); opacity: 1; filter: blur(0); }
        }

        @keyframes slide-out {
            0% { transform: translateY(0); opacity: 1; filter: blur(0); }
            100% { transform: translateY(-50%); opacity: 0; filter: blur(5px); }
        }

        /* Initial state of changing text */
        #dynamic-title {
            transition: transform 0.1s ease;
        }
        /* Video Hero Section */
        .video-hero {
            position: relative;
            height: 100vh;
            min-height: 500px;
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            margin-right: calc(-50vw + 50%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -2rem; /* Negate the navbar margin */
            margin-bottom: 4rem;
        }
        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.8; /* Controlled opacity */
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.3));
            z-index: -1;
        }
        .hero-content {
            z-index: 1;
            padding: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    {% include 'includes/navbar.html' %}

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    {% include 'includes/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
