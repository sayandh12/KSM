{% extends 'dashboard_base.html' %}

<!-- {% block title %}Manage Blogs - KSM Dashboard{% endblock %} -->

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-0">Blogs</h1>
        <p class="text-muted">Manage your news and updates.</p>
    </div>
    <a href="{% url 'blog_create' %}" class="btn btn-primary">
        <i class="fas fa-plus me-2"></i> Create Blog
    </a>
</div>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Blog Title</th>
                        <th>Author</th>
                        <th>Date Published</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for b in blogs %}
                    <tr>
                        <td class="ps-4">
                            <div class="fw-bold">{{ b.title }}</div>
                        </td>
                        <td>{{ b.author.username }}</td>
                        <td>{{ b.created_at|date:"M d, Y" }}</td>
                        <td class="text-end pe-4">
                            <a href="{% url 'blog_update' b.id %}" class="btn btn-sm btn-light border text-primary" title="Edit">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{% url 'blog_delete' b.id %}" class="btn btn-sm btn-light border text-danger ms-2" title="Delete">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center py-5 text-muted">
                            No blogs found.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<style>
    .rounded-4 { border-radius: 1rem !important; }
</style>
{% endblock %}
